name: T01 CYA Browser Lab

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Public HTTPS URL to inspect
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: tools/browser-lab/package-lock.json
      - name: Install Browser Lab dependencies
        working-directory: tools/browser-lab
        run: npm ci
      - name: Install Chromium
        working-directory: tools/browser-lab
        run: npx playwright install --with-deps chromium
      - name: Run T01
        working-directory: tools/browser-lab
        run: node runner.mjs --target-url "${{ inputs.target_url }}" --output-dir browser-lab-output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: t01-browser-lab-evidence
          path: tools/browser-lab/browser-lab-output
          retention-days: 7
