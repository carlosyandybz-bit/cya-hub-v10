  last_completed_subphase: 0.3
  last_completed_subphase_name: naming_repositorio_workspace_ramas_y_entornos
  last_completed_subphase_status: PASS
  active_subphase: 0.4
  active_subphase_name: variables_secretos_accesos_seguridad_y_limites_operativos
  active_subphase_status: IN_PROGRESS
  closure_gate_0_3: PASS
  next_subphase: 0.5
  next_subphase_status: PENDING_NOT_STARTED

phase_0_0_3_approved_decisions:
  naming:
    status: APPROVED_BY_USER
    project_name: CYA Hub v10
    repository_name: cya-hub-v10
  workspace:
    status: APPROVED_BY_USER
    technical_workspace: cya-hub-v10_repository
    single_versioned_technical_workspace: true
    internal_subdivision_established_in_0_3: false
    monorepo_established_in_0_3: false
    additional_workspace_system_established_in_0_3: false
    future_internal_structure_requires_architectural_need_and_explicit_user_approval: true
  branches:
    status: APPROVED_BY_USER
    stable_principal_branch: main
    change_branches: temporary_per_specific_change
    integration_target: main
    permanent_develop_branch: false
    scope: all_versioned_repository_artifacts
    includes:
      - code
      - documentation
      - github_actions_workflows
      - project_tooling_when_separately_authorized
    cya_browser_lab_covered_when_built: true
    authorizes_t01_construction_or_activation: false
  environments:
    status: APPROVED_BY_USER
    logical_environments:
      - VALIDATION
      - STAGING
      - PRODUCTION
    validation:
      type: temporary_logical_environment
      associated_with: change_branches_and_authorized_github_actions_tooling
      permanent_server_required: false
    staging:
      type: deployed_preproduction_environment
      purpose: integral_validation_and_acceptance
      production_equivalence_required: sufficient_for_valid_acceptance
      physical_location: DEFERRED_UNTIL_INFRASTRUCTURE_CAPABILITY_VERIFICATION
      deployment_mechanism: DEFERRED_UNTIL_INFRASTRUCTURE_CAPABILITY_VERIFICATION
    production:
      type: real_environment
      hosting_target: hostinger
      hosting_target_subject_to_capability_verification: true
    main_integration_authorizes_or_triggers_production_deploy: false
    permanent_development_environment_established: false
    mandatory_preview_environments_established: false
    future_preview_or_development_environment_requires_explicit_user_approval: true
    variables_secrets_and_per_environment_credentials_in_scope_of_0_3: false
    authorizes_environment_creation_or_deployment: false
    authorizes_pending_txx_tooling: false
  acceptance_criteria:
    status: APPROVED_BY_USER
    naming_repository_workspace_branches_and_environments_registered_and_coherent: true
    no_intrinsic_0_3_decision_pending_required: true
    roadmap_current_and_project_state_must_agree: true
    user_must_review_closeout_evidence: true
    explicit_user_closeout_acceptance_required: true
    approval_of_criteria_itself_closes_0_3: false

phase_0_0_3_pending_decisions:
  status: NONE

phase_0_0_3_closeout:
  status: PASS
  evidence_presented_to_user: true
  user_explicitly_accepted_closeout: true
  starts_0_4: false
  authorizes_t01_to_t11: false
  authorizes_environment_creation_or_deployment: false

phase_0_0_4:
  status: IN_PROGRESS
  start_authorization: APPROVED_BY_USER
  user_explicitly_authorized_start: true
  active_work_block:
    name: variables_and_secrets_policy
    selection_status: APPROVED_BY_USER
    selection_scope: work_focus_only
    concrete_policy_decisions_approved:
      - variable_classification
      - residence_policy
      - naming_convention
      - sensitive_credential_separation_by_environment
      - secret_exposure_and_documentation_policy
      - secret_lifecycle_policy
      - access_to_secrets_policy
  approved_decisions:
    variable_classification:
      status: APPROVED_BY_USER
      applies_to: all_cya_hub_v10_configuration_items
      categories:
        public_versionable:
          label: PUBLIC / VERSIONABLE
          definition: non_sensitive_information_that_may_exist_in_github
        environment_specific_non_secret:
          label: ENVIRONMENT-SPECIFIC / NON-SECRET
          definition: non_secret_information_whose_value_may_vary_by_environment
          environments:
            - VALIDATION
            - STAGING
            - PRODUCTION
        secret_sensitive:
          label: SECRET / SENSITIVE
          definition: tokens_passwords_keys_credentials_and_any_value_that_must_not_be_exposed
          versionable: false
      does_not_define:
        - storage_locations
        - secret_managers
        - variable_names
        - values
        - concrete_environment_mappings
        - variable_or_secret_change_procedures
    residence_policy:
      status: APPROVED_BY_USER
      public_versionable:
        repository_residence_allowed: true
      environment_specific_non_secret:
        must_be_separated_by_environment: true
        environments:
          - VALIDATION
          - STAGING
          - PRODUCTION
        physical_storage_location: UNDEFINED
      secret_sensitive:
        allowed_residence: authorized_secret_manager_for_corresponding_environment_or_service_only
        versioned_github_content_allowed: false
      specific_manager_or_mechanism_selected: false
      explicitly_not_selected:
        - github_secrets
        - hostinger
        - any_other_specific_manager_or_mechanism
      does_not_define:
        - variable_names
        - values
        - concrete_environment_mappings
        - variable_or_secret_change_procedures
    naming_convention:
      status: APPROVED_BY_USER
      format: UPPER_SNAKE_CASE
      allowed_characters:
        - A_Z
        - digits
        - underscore
      name_must_describe_configuration_stably_and_understandably: true
      environment_in_variable_name: false
      same_logical_key_name_across_environments: true
      environments:
        - VALIDATION
        - STAGING
        - PRODUCTION
      classification_prefixes_required: false
      classification_prefix_examples_not_added_by_default:
        - PUBLIC_
        - SECRET_
      global_cya_prefix_established_by_default: false
      future_technology_specific_prefix_or_format_exception:
        allowed_only_if_future_technology_is_approved: true
        exception_requires_decision_when_technology_is_approved: true
      generic_context_free_names_prohibited_examples:
        - KEY
        - TOKEN
        - URL
        - SECRET
      structural_example:
        preferred: SERVICE_API_KEY
        avoid: KEY
        introduces_real_service: false
      does_not_authorize:
        - variable_creation
        - secret_creation
        - manager_selection
        - value_definition
        - variable_or_secret_changes
    sensitive_credential_separation_by_environment:
      status: APPROVED_BY_USER
      production_credentials:
        exclusive_to_production: true
        allowed_in_validation: false
        allowed_in_staging: false
      validation_and_staging:
        use_separate_credentials_when_service_allows_independent_credentials: true
      cross_environment_reuse_for_convenience: prohibited
      external_service_without_independent_credentials:
        automatic_exception_allowed: false
        specific_service_analysis_required: true
        explicit_user_approval_required_before_use: true
      validation_staging_exception:
        may_be_proposed_only_if_real_service_limitation_exists: true
        automatic_approval: false
      production_nonproduction_sharing:
        permitted_by_policy: false
        if_future_integration_makes_separation_impossible: stop_and_present_concrete_case_to_user
      does_not_authorize:
        - secret_manager_selection
        - credential_creation
        - credential_value_definition
        - service_configuration
        - variable_or_secret_changes
    secret_exposure_and_documentation_policy:
      status: APPROVED_BY_USER
      real_secret_values:
        allowed_in_logs: false
        allowed_in_documentation: false
        allowed_in_github_issues_prs_or_comments: false
        allowed_in_screenshots: false
        allowed_in_evidence: false
        allowed_in_traces_or_artifacts: false
        allowed_in_versioned_files: false
        allowed_in_project_documentary_outputs: false
      secret_names:
        may_be_documented_if_name_itself_is_not_sensitive: true
        purpose_category_and_applicable_environment_may_be_documented: true
      example_files:
        env_example_and_equivalents_may_contain_variable_names: true
        placeholders_must_be_unequivocally_fake: true
        real_values_allowed: false
        real_fragments_allowed: false
        partially_hidden_real_secret_copies_allowed: false
      evidence_of_configuration:
        allowed_metadata:
          - name
          - environment
          - presence_or_absence
          - verification_result
        secret_value_allowed: false
      accidental_exposure_in_evidence:
        redact_before_retention_or_sharing: true
        if_safe_redaction_cannot_be_guaranteed: do_not_retain_artifact_as_evidence
      credential_carriers_same_treatment:
        - authentication_headers
        - cookies
        - tokens_in_urls_or_query_strings
        - any_other_credential_carrier
      masking:
        may_preserve_real_reconstructable_or_identifying_fragments: false
        neutral_documentation_representations:
          - "***"
          - fictitious_placeholders
      unauthorized_secret_exposure:
        stop_propagation: true
        return_case_to_user_as_security_decision: true
        automatically_authorizes_rotation_revocation_deletion_or_modification: false
      does_not_authorize:
        - secret_manager_selection
        - value_creation
        - credential_rotation
        - credential_revocation
        - credential_deletion
        - credential_modification
        - service_configuration
    secret_lifecycle_policy:
      status: APPROVED_BY_USER
      creation:
        only_when_concrete_and_approved_need_exists_for_specific_service_and_environment: true
      required_documented_metadata_without_value:
        - name
        - purpose
        - service
        - environment
        - state
      universal_calendar_based_periodic_rotation: false
      provider_specific_expiration_or_rotation:
        define_for_that_service_when_required: true
      rotation_triggers_that_require_proposal:
        - real_or_suspected_exposure
        - compromise
        - unauthorized_access
        - provider_requirement
        - change_that_makes_current_credential_invalid
      detecting_rotation_trigger_automatically_authorizes_execution: false
      replacement_when_temporary_coexistence_is_supported:
        validate_new_credential_before_retiring_previous_one: true
        concrete_execution_requires_authorization: true
      credential_no_longer_needed:
        state: pending_revocation_or_retirement
        keep_active_for_convenience: false
      revocation_deletion_or_destruction:
        explicit_and_separately_authorized_action_required: true
        automatic_by_policy: false
      evidence_after_approved_replacement_or_revocation:
        allowed_metadata:
          - name
          - environment
          - reason
          - state
          - result
        old_value_allowed: false
        new_value_allowed: false
      does_not_select:
        - secret_managers
        - values
        - personal_owners
        - specific_frequencies
        - procedures_for_services_not_yet_approved
      does_not_authorize:
        - credential_creation
        - credential_replacement
        - credential_rotation
        - credential_revocation
        - credential_deletion
        - credential_retirement
        - secret_creation
        - secret_replacement
        - secret_rotation
        - secret_revocation
        - secret_deletion
        - secret_retirement
    access_to_secrets_policy:
      status: APPROVED_BY_USER
      access_subjects:
        allowed_only_when_specifically_authorized_and_approved_need_exists: true
        possible_subject_types:
          - person
          - service
          - tool
          - process
      authorization_scope:
        limited_to_necessary_secret_service_and_environment: true
        system_or_application_access_implies_all_secret_access: false
      production_secret_access:
        reinforced_isolation: true
        derived_from_validation_access: false
        derived_from_staging_access: false
        derived_from_repository_access: false
      access_for_convenience_or_technical_possibility_only: prohibited
      secret_value_disclosure:
        when_process_can_operate_without_exposing_value: not_necessary
      connected_project_actors:
        chatgpt_agents_automations_and_tools_receive_secret_values_by_connection_alone: false
        future_effective_access_requires_expressly_authorized_action_and_scope: true
      access_authorization_documentation_without_secret_value:
        required_metadata:
          - authorized_subject
          - secret_name
          - environment
          - purpose
          - scope
          - state
      access_no_longer_needed:
        state: pending_removal_or_reduction
        automatic_permission_modification_or_revocation_authorized: false
        exact_execution_authorization_required: true
      access_change_actions:
        separate_action_required_for:
          - grant
          - expand
          - reduce
          - revoke
        policy_approval_executes_any_access_change: false
      does_not_select:
        - secret_managers
        - concrete_users
        - concrete_roles
        - provider_permissions
        - technology_specific_procedures
      does_not_authorize:
        - access_grant
        - access_expansion
        - access_reduction
        - access_revocation
        - secret_manager_selection
  internal_decisions_approved:
    - variable_classification
    - residence_policy
    - naming_convention
    - sensitive_credential_separation_by_environment
    - secret_exposure_and_documentation_policy
    - secret_lifecycle_policy
    - access_to_secrets_policy
  closure_gate: NOT_READY
  authorizes_variable_or_secret_changes: false
  authorizes_access_changes: false
  authorizes_security_setting_changes: false
  authorizes_txx_construction_or_activation: false
  authorizes_environment_creation_or_deployment: false

legacy_policy_established:
  mode: READ_ONLY
  includes_all_legacy: true
  cya_hub_v3_included: true
  consultation_requires_explicit_user_authorization: true
  consultation_location: user_designated_decision_area
  consultation_purpose: decision_reference_only
  implementation_source_from_legacy: prohibited
  direct_legacy_reuse_authorized: false
  prohibited:
    - modify_legacy
    - migrate_legacy
    - deploy_into_legacy
    - write_to_legacy
    - reuse_legacy_secrets

implementation_decision_source_policy:
  source_of_truth_for_decisions: cya_hub_v10_decision_documents
  legacy_is_not_implementation_source: true
  implementation_chats_use_decision_documents: true

next_action:
  type: USER_DECISION_GATE
  phase: 0
  subphase: 0.4
  work_block: variables_and_secrets_policy
  action: define_next_exact_concrete_variables_and_secrets_policy_decision
  blocked_until_user: true

prohibited_progression:
  - do_not_close_0_4_without_explicit_user_acceptance
  - do_not_start_0_5_without_explicit_user_approval
  - do_not_create_or_change_variables_or_secrets_without_explicit_user_approval
  - do_not_modify_access_without_explicit_user_approval
  - do_not_build_t01_to_t11_without_explicit_user_approval_for_the_exact_action
  - do_not_create_or_deploy_environments_without_explicit_user_approval_for_the_exact_action

blockers: []

approved_infrastructure:
  hosting: hostinger_already_paid
  domain: already_paid
  repository: github_public
  ci_runner: github_actions
  incremental_cost_target_eur: 0
