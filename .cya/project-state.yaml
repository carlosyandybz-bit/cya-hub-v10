phase_0_0_4:
  status: IN_PROGRESS
  start_authorization: APPROVED_BY_USER
  user_explicitly_authorized_start: true
  active_work_block:
    name: variables_and_secrets_policy
    selection_status: APPROVED_BY_USER
    selection_scope: work_focus_only
    concrete_policy_decisions_approved:
      - variable_classification
      - residence_policy
    next_decision_focus:
      name: naming_convention
      selection_status: APPROVED_BY_USER
      selection_scope: decision_focus_only
      concrete_naming_rules_approved: NONE_YET
  approved_decisions:
    variable_classification:
      status: APPROVED_BY_USER
      applies_to: all_cya_hub_v10_configuration_items
      categories:
        public_versionable:
          label: PUBLIC / VERSIONABLE
          definition: non_sensitive_information_that_may_exist_in_github
        environment_specific_non_secret:
          label: ENVIRONMENT-SPECIFIC / NON-SECRET
          definition: non_secret_information_whose_value_may_vary_by_environment
          environments:
            - VALIDATION
            - STAGING
            - PRODUCTION
        secret_sensitive:
          label: SECRET / SENSITIVE
          definition: tokens_passwords_keys_credentials_and_any_value_that_must_not_be_exposed
          versionable: false
      does_not_define:
        - storage_locations
        - secret_managers
        - variable_names
        - values
        - concrete_environment_mappings
        - variable_or_secret_change_procedures
    residence_policy:
      status: APPROVED_BY_USER
      public_versionable:
        repository_residence_allowed: true
      environment_specific_non_secret:
        must_be_separated_by_environment: true
        environments:
          - VALIDATION
          - STAGING
          - PRODUCTION
        physical_storage_location: UNDEFINED
      secret_sensitive:
        allowed_residence: authorized_secret_manager_for_corresponding_environment_or_service_only
        versioned_github_content_allowed: false
      specific_manager_or_mechanism_selected: false
      explicitly_not_selected:
        - github_secrets
        - hostinger
        - any_other_specific_manager_or_mechanism
      does_not_define:
        - variable_names
        - values
        - concrete_environment_mappings
        - variable_or_secret_change_procedures
  internal_decisions_approved:
    - variable_classification
    - residence_policy
  closure_gate: NOT_READY
  authorizes_variable_or_secret_changes: false
  authorizes_access_changes: false
  authorizes_security_setting_changes: false
  authorizes_txx_construction_or_activation: false
  authorizes_environment_creation_or_deployment: false

