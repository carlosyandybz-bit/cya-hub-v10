phase_0_0_4:
  status: IN_PROGRESS
  start_authorization: APPROVED_BY_USER
  active_work_block:
    name: variables_and_secrets_policy
    selection_status: APPROVED_BY_USER
  concrete_policy_decisions_approved:
    - variable_classification
    - residence_policy
    - naming_convention
    - sensitive_credential_separation_by_environment
    - secret_exposure_and_documentation_policy
    - secret_lifecycle_policy
    - access_to_secrets_policy
    - configuration_inventory_and_registration_policy
    - inventory_residence_format_and_maintenance_policy
    - environment_specific_non_secret_residence_policy
    - configuration_inventory_filename
    - configuration_inventory_logical_structure
    - configuration_inventory_state_vocabulary
    - configuration_inventory_structured_reference_format
  approved_decisions:
    variable_classification:
      status: APPROVED_BY_USER
      categories:
        - PUBLIC / VERSIONABLE
        - ENVIRONMENT-SPECIFIC / NON-SECRET
        - SECRET / SENSITIVE
      secret_sensitive_versionable: false
    residence_policy:
      status: APPROVED_BY_USER
      public_versionable_repository_residence_allowed: true
      environment_specific_non_secret_separated_by_environment: true
      secret_sensitive_allowed_residence: authorized_secret_manager_for_corresponding_environment_or_service_only
      secret_sensitive_versioned_github_content_allowed: false
      specific_manager_selected: false
    naming_convention:
      status: APPROVED_BY_USER
      format: UPPER_SNAKE_CASE
      environment_in_variable_name: false
      classification_prefix_required: false
      global_cya_prefix_established: false
      future_technology_exception_requires_explicit_approval: true
    sensitive_credential_separation_by_environment:
      status: APPROVED_BY_USER
      production_credentials_exclusive_to_production: true
      validation_and_staging_separate_when_service_allows: true
      cross_environment_reuse_for_convenience: prohibited
      provider_limitation_requires_concrete_user_approved_exception: true
      production_nonproduction_sharing_permitted: false
    secret_exposure_and_documentation_policy:
      status: APPROVED_BY_USER
      real_values_allowed_in_versioned_documentary_or_evidence_outputs: false
      non_sensitive_name_purpose_classification_environment_may_be_documented: true
      example_placeholders_must_be_fake: true
      accidental_exposure_requires_redaction_or_artifact_rejection: true
      exposure_detection_automatically_authorizes_rotation_or_revocation: false
    secret_lifecycle_policy:
      status: APPROVED_BY_USER
      creation_requires_concrete_approved_service_and_environment_need: true
      universal_calendar_rotation: false
      rotation_trigger_requires_proposal_not_automatic_execution: true
      revocation_deletion_retirement_require_separate_authorization: true
      evidence_retains_secret_values: false
    access_to_secrets_policy:
      status: APPROVED_BY_USER
      access_requires_specific_authorized_subject_and_approved_need: true
      scope_limited_to_secret_service_environment: true
      production_isolation: reinforced
      project_connection_grants_secret_values: false
      grant_expand_reduce_revoke_are_separate_actions: true
    configuration_inventory_and_registration_policy:
      status: APPROVED_BY_USER
      inventory_entry_required_once_configuration_existence_approved: true
      required_metadata:
        - name
        - classification
        - purpose
        - related_service_or_system
        - applicable_environments
        - state
      secret_entry_may_reference_approved_residence_without_value: true
      same_logical_name_duplicated_only_due_to_environments: false
      retired_configuration_traceability_preserved_without_values: true
      credential_store: false
    inventory_residence_format_and_maintenance_policy:
      status: APPROVED_BY_USER
      canonical_source: single_versioned_repository_file
      format: YAML
      directory: .cya/
      second_canonical_drive_copy: false
      real_secret_values_allowed: false
      update_responsibility_follows_expressly_authorized_change_actor: true
      automatic_discrepancy_correction: false
      history_source: github_version_history
    environment_specific_non_secret_residence_policy:
      status: APPROVED_BY_USER
      global_shared_residence: false
      each_environment_keeps_own_value: true
      cross_environment_value_read_or_reuse: false
      concrete_mechanisms:
        VALIDATION: DEFERRED_UNTIL_TOOL_OR_PROCESS_FOR_TEMPORARY_CONTEXT_IS_APPROVED
        STAGING: DEFERRED_WITH_PHYSICAL_STAGING_INFRASTRUCTURE
        PRODUCTION: DEFERRED_UNTIL_REAL_PRODUCTION_HOSTING_CONFIGURATION_CAPABILITY_IS_VERIFIED_AND_APPROVED
      non_secret_classification_automatically_authorizes_versioning_values: false
    configuration_inventory_filename:
      status: APPROVED_BY_USER
      path: .cya/configuration-inventory.yaml
      format: YAML
      authorizes_inventory_file_creation: false
    configuration_inventory_logical_structure:
      status: APPROVED_BY_USER
      root: configuration_items
      item_fields:
        - name
        - classification
        - purpose
        - service_or_system
        - environments
        - residence_reference
        - rules_references
      environments:
        VALIDATION:
          field: state
        STAGING:
          field: state
        PRODUCTION:
          field: state
      classification_values:
        - PUBLIC / VERSIONABLE
        - ENVIRONMENT-SPECIFIC / NON-SECRET
        - SECRET / SENSITIVE
      residence_reference:
        only_approved_residence_when_applicable: true
        real_values_allowed: false
      rules_references:
        possible_approved_references:
          - expiration
          - rotation
          - access
      explicitly_undecided:
        - reference_type_values
        - reference_syntax
        - additional_required_or_optional_rules
        - schema_version
        - additional_metadata
      authorizes_inventory_file_creation: false
      authorizes_real_configuration_items_or_values: false
      authorizes_secret_manager_or_automation: false
    configuration_inventory_state_vocabulary:
      status: APPROVED_BY_USER
      applies_to: environments_each_state_field
      allowed_values:
        - NOT_CONFIGURED
        - CONFIGURED
        - ACTIVE
        - PENDING_REMOVAL
        - RETIRED
      semantics:
        NOT_CONFIGURED: applies_to_environment_but_not_configured
        CONFIGURED: configured_but_not_yet_sufficiently_validated_for_operational_use
        ACTIVE: configured_and_validated_for_intended_use
        PENDING_REMOVAL: removal_determined_but_not_yet_executed
        RETIRED: no_longer_operational_in_environment_retained_only_for_historical_traceability
      automatic_or_inferred_state_changes: prohibited
      state_change_requires_applicable_authorization: true
      authorizes_inventory_file_creation: false
      authorizes_variable_or_secret_changes: false
      authorizes_removal_execution: false
      authorizes_access_changes: false
      authorizes_secret_manager_or_environment_mechanism_selection: false
      authorizes_environment_deployment: false
      authorizes_txx_activation: false
    configuration_inventory_structured_reference_format:
      status: APPROVED_BY_USER
      format: structured
      applies_to:
        - residence_reference
        - rules_references.expiration
        - rules_references.rotation
        - rules_references.access
      fields:
        - type
        - reference
      semantics:
        type: identifies_reference_class_or_origin
        reference: pointer_or_reference_only
      real_secret_values_allowed: false
      reconstructable_sensitive_information_allowed: false
      allowed_type_values: UNDECIDED
      reference_syntax: UNDECIDED
      concrete_manager_url_id_path_or_environment_mechanism_selected: false
      authorizes_inventory_file_creation: false
      authorizes_variable_or_secret_changes: false
      authorizes_access_changes: false
      authorizes_environment_deployment: false
      authorizes_txx_activation: false
  closure_gate: NOT_READY
  authorizes_variable_or_secret_changes: false
  authorizes_access_changes: false
  authorizes_security_setting_changes: false
  authorizes_inventory_file_creation: false
  authorizes_environment_specific_non_secret_residence_configuration: false
  authorizes_txx_construction_or_activation: false
  authorizes_environment_creation_or_deployment: false

