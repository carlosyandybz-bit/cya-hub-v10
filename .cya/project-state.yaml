project: CYA Hub v10

state_authority:
  mutable_state_file: .cya/current-state.yaml
  mutable_state_role: single_versioned_machine_readable_authority
  state_contract_fields:
    - phase
    - last_completed_subphase
    - last_completed_status
    - active_subphase
    - active_subphase_status
    - next_subphase
    - next_subphase_status
    - active_action
  duplicate_mutable_state_in_current_md: prohibited
  duplicate_mutable_state_in_project_state: prohibited
  ordinary_transition_updates_current_state_first: true
  current_md_role: human_navigation_and_context_panel
  project_state_role: stable_operational_context_and_references
  roadmap_role: canonical_documentary_decisions_and_phase_history
  historical_traceability:
    - git_history
    - roadmap_drive

sources_of_truth:
  roadmap_drive: https://docs.google.com/document/d/1yTYr1eS_b3cuODTyC2yz1uEGsB2-n0Ba0WdrPrPs4Bo/edit
  tool_guide_drive: https://docs.google.com/document/d/1eDWjwqQhk8lQNeiDuzShzD9tJbtvzlqIk-jEazGXF0A/edit
  code_repository: https://github.com/carlosyandybz-bit/cya-hub-v10
  mutable_operational_state: .cya/current-state.yaml
  tool_registry: .cya/tool-registry.yaml
  tool_plan_template: .cya/planning-template.md

user_authority_policy:
  no_assumptions: true
  missing_ambiguous_or_conflicting_information: ask_user_before_action
  explicit_user_review_required: true
  explicit_user_acceptance_required_before_execution_or_closure: true
  explicit_instruction_scope: exact_action_and_scope_only
  pass_requires_user_acceptance: true
  progression_requires_user_acceptance: true
  pending_approval_state: PENDING_USER_APPROVAL
  connected_access_is_not_authorization: true
  antigravity: not_part_of_project

legacy_policy:
  all_legacy_read_only: true
  cya_hub_v3_read_only: true
  consultation_requires_explicit_user_authorization: true
  consultation_purpose: decision_reference_only
  implementation_source_from_legacy: prohibited
  direct_legacy_reuse_authorized: false
  legacy_secret_reuse_authorized: false

repository_policy:
  repository: carlosyandybz-bit/cya-hub-v10
  stable_branch: main
  change_branches: temporary_per_specific_change
  permanent_develop_branch: false
  main_merge_authorizes_or_triggers_production_deploy: false

logical_environments:
  - VALIDATION
  - STAGING
  - PRODUCTION

environment_policy:
  validation: temporary_logical_environment
  staging_physical_location: hostinger_at_desarrollo.carlosyandy.com
  staging_deployment_mechanism: hostinger_native_github_integration_from_main_manual_controlled
  production_hosting_target: hostinger
  production_target_subject_to_capability_verification: true

configuration_and_secret_policy:
  classifications:
    - PUBLIC / VERSIONABLE
    - ENVIRONMENT-SPECIFIC / NON-SECRET
    - SECRET / SENSITIVE
  real_secrets_in_repository: prohibited
  cross_environment_secret_reuse_for_convenience: prohibited
  production_credentials_exclusive_to_production: true
  configuration_inventory_path: .cya/configuration-inventory.yaml
  configuration_inventory_creation_authorized_by_policy_alone: false

quality_and_evidence_policy:
  claim_is_evidence: false
  evidence_replaces_user_acceptance: false
  relevant_evidence_must_match_claim_nature: true
  evidence_bound_to_exact_revision_or_state: true
  affected_rerun_required_after_relevant_change: true
  pass_history_is_not_rewritten_by_later_regression: true
  blocking_findings_prevent_done_or_pass: true
  workaround_or_patch_without_explicit_prior_user_acceptance: prohibited
  root_cause_first_for_errors: true

tool_governance:
  registry: .cya/tool-registry.yaml
  lifecycle_values:
    - PENDING
    - ACTIVE
    - DEFERRED
    - RETIRED
  one_primary_route_per_action: true
  silent_fallback: prohibited
  fallback_requires_explicit_user_approval: true
  connected_access_is_authorization: false
  significant_technical_work_requires_tool_plan: true
  tool_plan_template: .cya/planning-template.md
  tool_registry_changes_only_when_global_schema_policy_routing_or_index_changes: true
  tool_lifecycle_and_tool_specific_metadata_change_only_in_individual_txx_file: true

codex_policy:
  primary_for_application_implementation_when_included_usage_available: true
  included_usage_only_by_default: true
  paid_overage_or_credit_purchase_without_explicit_approval: prohibited
  validation_qa_audit_security_deployment_and_gates_reserved_to_chats_and_approved_tools: true
  legacy_as_implementation_source: prohibited

cost_policy:
  default_incremental_cost_eur: 0
  new_spend_requires_explicit_user_approval: true
  auto_topup_upgrade_or_paid_overage_authorized_by_default: false

conversation_and_user_action_policy:
  user_action_required_only_when_user_intervention_is_actually_required: true
  do_not_request_manual_work_when_approved_connected_tool_can_safely_do_it: true
  handoff_when_context_risk_requires: true
  phase_or_subphase_progression_requires_explicit_user_acceptance: true

state_transition_invariants:
  closed_status_cannot_be_active_subphase: true
  pending_not_started_cannot_be_active_subphase: true
  next_subphase_does_not_imply_started: true
  active_subphase_may_be_absent_when_none_is_active: true
  validate_current_state_before_pr_or_final_state_sync: true

notes:
  - Detailed approved decisions and historical closeouts are canonical in the Drive Roadmap Vivo.
  - Prior expanded project-state snapshots remain available through Git history.
  - This file intentionally excludes mutable phase/subphase fields to prevent competing state mirrors.
